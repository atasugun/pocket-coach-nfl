[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline", "pipeline.detect", "api"]

[project]
name = "pass-protection-error-finder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.9",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
